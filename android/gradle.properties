org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true

# AGP 9 compatibility for plugins that haven't migrated yet (on_audio_query_android)
android.newDsl=false
android.builtInKotlin=false

# Downgrade Java/Kotlin target mismatches from errors to warnings
kotlin.jvm.target.validation.mode=warning
kotlin.incremental=true