name: aura_music
description: "Aura Music - a modern dark-themed local music player."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.2.2
  on_audio_query: ^2.9.0
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

dependency_overrides:
  on_audio_query_android:
    path: packages/on_audio_query_android

flutter:
  uses-material-design: true

  assets:
    - assets/logo.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_logo.png"
  min_sdk_android: 24
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/app_logo.png"
  adaptive_icon_foreground_inset: 20

flutter_native_splash:
  color: "#121212"
  image: assets/app_logo.png
  android_12:
    color: "#121212"
    image: assets/app_logo.png
    icon_background_color: "#121212"